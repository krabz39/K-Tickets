
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create New Password | K-Tickets</title>

    <style>

        :root {
            --bordo: #6C151E;
            --bordo-dark: #541018;
            --green: #0F3D3A;
            --cream: #F5DABF;
            --white: #FFFDF9;
            --text: #1D2927;
            --muted: #6D7774;
            --border: rgba(15, 61, 58, 0.14);
            --danger: #A52835;
            --success: #21735D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: grid;
            place-items: center;

            padding: 22px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--cream);
            color: var(--text);
        }

        button,
        input {
            font: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .card {
            width: 100%;
            max-width: 480px;

            padding: clamp(25px, 5vw, 45px);

            background: var(--white);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(15, 61, 58, 0.13);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            color: var(--green);

            font-weight: 900;
        }

        .brand-mark {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: var(--bordo);
            color: var(--cream);

            font-weight: 900;
        }

        h1 {
            margin-top: 40px;

            color: var(--green);

            font-size: clamp(30px, 7vw, 42px);
            line-height: 1;

            letter-spacing: -1.5px;
        }

        .intro {
            margin-top: 12px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.6;
        }

        form {
            margin-top: 28px;
        }

        .message {
            display: none;

            margin-bottom: 17px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: var(--danger);
            background: rgba(165, 40, 53, 0.08);
        }

        .message.success {
            color: var(--success);
            background: rgba(33, 115, 93, 0.08);
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: var(--green);

            font-size: 13px;
            font-weight: 800;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;

            min-height: 53px;

            padding:
                0 62px
                0 15px;

            border:
                1px solid var(--border);

            border-radius: 13px;

            outline: none;

            background: #FFFCF8;
        }

        input:focus {
            border-color: var(--bordo);

            box-shadow:
                0 0 0 4px rgba(108, 21, 30, 0.08);
        }

        .toggle {
            position: absolute;

            right: 9px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            padding: 8px;

            color: var(--green);

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .strength {
            margin-top: 8px;

            color: var(--muted);

            font-size: 11px;
        }

        button[type="submit"] {
            width: 100%;

            min-height: 54px;

            margin-top: 5px;

            border: 0;
            border-radius: 13px;

            background: var(--bordo);
            color: white;

            font-weight: 900;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        button[type="submit"]:hover {
            background: var(--bordo-dark);
            transform: translateY(-2px);
        }

        button[type="submit"]:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .back {
            display: block;

            margin-top: 23px;

            text-align: center;

            color: var(--green);

            font-size: 12px;
            font-weight: 800;
        }

        .back:hover {
            color: var(--bordo);
        }

        @media (max-width: 380px) {

            body {
                padding: 13px;
            }

            .card {
                padding: 24px 18px;
                border-radius: 20px;
            }
        }

    </style>

</head>

<body>

<main class="card">

    <a
        href="index.html"
        class="brand"
    >

        <span class="brand-mark">
            K
        </span>

        <span>
            K-Tickets
        </span>

    </a>


    <h1>
        Create a new password
    </h1>


    <p class="intro">
        Choose a strong password for your K-Tickets account.
    </p>


    <form
        id="newPasswordForm"
        novalidate
    >

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
        ></div>


        <div class="field">

            <label for="password">
                New password
            </label>

            <div class="input-wrap">

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    id="passwordToggle"
                >
                    Show
                </button>

            </div>

            <div class="strength" id="strength">
                Use at least 8 characters.
            </div>

        </div>


        <div class="field">

            <label for="confirmPassword">
                Confirm password
            </label>

            <div class="input-wrap">

                <input
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Repeat your password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    id="confirmToggle"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            id="submitButton"
        >
            Update password
        </button>

    </form>


    <a
        href="login.html"
        class="back"
    >
        ← Back to sign in
    </a>

</main>


<script>

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );

    const strength =
        document.getElementById("strength");


    function togglePassword(
        input,
        button
    ) {

        const show =
            input.type === "password";

        input.type =
            show ? "text" : "password";

        button.textContent =
            show ? "Hide" : "Show";

    }


    document
        .getElementById("passwordToggle")
        .addEventListener("click", () => {

            togglePassword(
                password,
                document.getElementById(
                    "passwordToggle"
                )
            );

        });


    document
        .getElementById("confirmToggle")
        .addEventListener("click", () => {

            togglePassword(
                confirmPassword,
                document.getElementById(
                    "confirmToggle"
                )
            );

        });


    password.addEventListener("input", () => {

        const length =
            password.value.length;

        if (length === 0) {

            strength.textContent =
                "Use at least 8 characters.";

        } else if (length < 8) {

            strength.textContent =
                "Password is too short.";

        } else if (length < 12) {

            strength.textContent =
                "Good. A longer password is recommended.";

        } else {

            strength.textContent =
                "Strong password length.";

        }

    });


    const form =
        document.getElementById(
            "newPasswordForm"
        );

    const message =
        document.getElementById("message");

    const submitButton =
        document.getElementById(
            "submitButton"
        );


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message show " + type;

    }


    form.addEventListener("submit", event => {

        event.preventDefault();

        message.className = "message";

        if (password.value.length < 8) {

            showMessage(
                "Your password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        if (
            password.value !==
            confirmPassword.value
        ) {

            showMessage(
                "The passwords do not match.",
                "error"
            );

            return;
        }


        submitButton.disabled = true;

        submitButton.textContent =
            "Updating password...";


        /*
            SUPABASE PASSWORD UPDATE
            WILL BE CONNECTED HERE.
        */

        setTimeout(() => {

            submitButton.disabled = false;

            submitButton.textContent =
                "Update password";

            showMessage(
                "Password update will be connected to Supabase next.",
                "success"
            );

        }, 700);

    });

</script>

</body>
</html>
