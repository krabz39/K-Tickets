<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | K-Tickets</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --bordo: #6C151E;
            --green: #0F3D3A;
            --cream: #F5DABF;
            --white: #fff;
            --dark: #171414;
            --muted: #756b67;
            --border: rgba(15,61,58,.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fbf7f2;
            color: var(--dark);
            font-family: Inter, Arial, sans-serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font: inherit;
        }

        .topbar {
            height: 74px;
            background: var(--green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--cream);
            color: var(--green);
            display: grid;
            place-items: center;
            font-weight: 900;
        }

        .back {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,.8);
        }

        .content {
            width: min(1100px, calc(100% - 28px));
            margin: auto;
            padding: 45px 0 70px;
        }

        .heading {
            margin-bottom: 28px;
        }

        .heading h1 {
            color: var(--green);
            font-family: Georgia, serif;
            font-size: clamp(31px, 5vw, 45px);
        }

        .heading p {
            color: var(--muted);
            margin-top: 7px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search {
            min-width: min(100%, 360px);
        }

        .search input {
            width: 100%;
            border: 1px solid var(--border);
            background: white;
            border-radius: 13px;
            padding: 13px 15px;
            outline: none;
        }

        .search input:focus {
            border-color: var(--green);
        }

        .filters {
            display: flex;
            gap: 7px;
        }

        .filter {
            border: 1px solid var(--border);
            background: white;
            color: var(--green);
            border-radius: 11px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 800;
        }

        .filter.active {
            background: var(--green);
            color: white;
        }

        .orders {
            display: grid;
            gap: 13px;
        }

        .order {
            background: white;
            border: 1px solid var(--border);
            border-radius: 19px;
            padding: 21px;
            display: grid;
            grid-template-columns: minmax(0,1fr) auto auto;
            gap: 20px;
            align-items: center;
            box-shadow: 0 12px 35px rgba(15,61,58,.06);
        }

        .order-title {
            color: var(--green);
            font-weight: 900;
        }

        .order-id {
            margin-top: 5px;
            color: var(--muted);
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }

        .order-date {
            color: var(--muted);
            font-size: 12px;
        }

        .order-status {
            padding: 8px 11px;
            border-radius: 50px;
            background: #e8f2ef;
            color: var(--green);
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .order-status.failed,
        .order-status.cancelled,
        .order-status.refunded {
            background: #f5e3e4;
            color: var(--bordo);
        }

        .view {
            background: var(--cream);
            color: var(--green);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 11px;
            font-weight: 900;
        }

        .state {
            padding: 55px 20px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 22px;
            text-align: center;
        }

        .state h2 {
            color: var(--green);
            font-family: Georgia, serif;
        }

        .state p {
            color: var(--muted);
            line-height: 1.6;
            margin: 8px auto 20px;
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(15,61,58,.12);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {

            .order {
                grid-template-columns: 1fr auto;
            }

            .order-date {
                display: none;
            }
        }

        @media (max-width: 500px) {

            .topbar {
                padding: 0 16px;
            }

            .content {
                width: min(100% - 18px, 1100px);
                padding-top: 30px;
            }

            .toolbar {
                display: grid;
            }

            .search {
                min-width: 100%;
            }

            .filters {
                width: 100%;
            }

            .filter {
                flex: 1;
            }

            .order {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .view {
                text-align: center;
            }
        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="mark">
            K
        </div>

        <strong>
            K-Tickets
        </strong>

    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</header>

<main class="content">

    <section class="heading">

        <h1>
            My Orders
        </h1>

        <p>
            View purchases and payment records connected
            to your account.
        </p>

    </section>

    <div class="toolbar">

        <div class="search">

            <input
                id="search"
                type="search"
                placeholder="Search orders..."
                autocomplete="off"
            >

        </div>

        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="paid"
            >
                Paid
            </button>

            <button
                class="filter"
                data-filter="pending"
            >
                Pending
            </button>

        </div>

    </div>

    <div
        class="state"
        id="loading"
    >

        <div class="loader"></div>

        <h2>
            Loading orders
        </h2>

        <p>
            Retrieving your account records.
        </p>

    </div>

    <div
        class="state hidden"
        id="empty"
    >

        <h2>
            No orders yet
        </h2>

        <p>
            Your completed and pending purchases
            will appear here.
        </p>

        <a
            href="events.html"
            style="
                display:inline-block;
                background:#0F3D3A;
                color:white;
                padding:12px 16px;
                border-radius:12px;
                font-weight:800;
                font-size:12px;
            "
        >
            Browse Events
        </a>

    </div>

    <div
        class="state hidden"
        id="noResults"
    >

        <h2>
            No matching orders
        </h2>

        <p>
            Try another search or status filter.
        </p>

    </div>

    <div
        class="orders hidden"
        id="orders"
    ></div>

</main>

<script>

    const SUPABASE_URL =
        window.KTICKETS_SUPABASE_URL || "";

    const SUPABASE_ANON_KEY =
        window.KTICKETS_SUPABASE_ANON_KEY || "";

    let supabaseClient = null;

    let allOrders = [];
    let activeFilter = "all";

    function initializeSupabase() {

        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
            throw new Error(
                "Supabase configuration has not been added yet."
            );
        }

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );
    }

    function escapeHtml(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {

        if (!value) {
            return "Date unavailable";
        }

        const date =
            new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return new Intl.DateTimeFormat(
            undefined,
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        ).format(date);
    }

    function formatStatus(value) {

        return String(value || "unknown")
            .replaceAll("_", " ")
            .replace(/\b\w/g, c => c.toUpperCase());
    }

    async function getUser() {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            throw error;
        }

        if (!data.user) {

            window.location.href =
                "../auth/login.html";

            return null;
        }

        return data.user;
    }

    async function loadOrders(user) {

        const {
            data,
            error
        } = await supabaseClient
            .from("orders")
            .select(`
                id,
                user_id,
                event_id,
                status,
                subtotal,
                service_fee,
                total,
                currency,
                created_at
            `)
            .eq("user_id", user.id)
            .order("created_at", {
                ascending: false
            });

        if (error) {
            throw error;
        }

        const orders =
            data || [];

        const eventIds = [
            ...new Set(
                orders
                    .map(order => order.event_id)
                    .filter(Boolean)
            )
        ];

        let events = [];

        if (eventIds.length) {

            const response =
                await supabaseClient
                    .from("events")
                    .select(`
                        id,
                        title,
                        start_at
                    `)
                    .in("id", eventIds);

            if (response.error) {
                throw response.error;
            }

            events =
                response.data || [];
        }

        const eventMap =
            new Map(
                events.map(event =>
                    [event.id, event]
                )
            );

        allOrders =
            orders.map(order => ({
                ...order,
                event:
                    eventMap.get(
                        order.event_id
                    ) || null
            }));

        render();
    }

    function render() {

        const ordersElement =
            document.getElementById("orders");

        const searchTerm =
            document.getElementById("search")
                .value
                .trim()
                .toLowerCase();

        let filtered =
            allOrders.filter(order => {

                const status =
                    String(order.status || "")
                        .toLowerCase();

                if (
                    activeFilter === "paid" &&
                    ![
                        "paid",
                        "completed",
                        "confirmed"
                    ].includes(status)
                ) {
                    return false;
                }

                if (
                    activeFilter === "pending" &&
                    ![
                        "pending",
                        "payment_pending",
                        "awaiting_payment",
                        "awaiting_verification"
                    ].includes(status)
                ) {
                    return false;
                }

                if (!searchTerm) {
                    return true;
                }

                return [
                    order.id,
                    order.event?.title,
                    order.status
                ]
                    .join(" ")
                    .toLowerCase()
                    .includes(searchTerm);
            });

        document
            .getElementById("loading")
            .classList.add("hidden");

        document
            .getElementById("empty")
            .classList.add("hidden");

        document
            .getElementById("noResults")
            .classList.add("hidden");

        ordersElement.classList.add("hidden");

        if (!allOrders.length) {

            document
                .getElementById("empty")
                .classList.remove("hidden");

            return;
        }

        if (!filtered.length) {

            document
                .getElementById("noResults")
                .classList.remove("hidden");

            return;
        }

        ordersElement.classList.remove("hidden");

        ordersElement.innerHTML =
            filtered.map(order => {

                const status =
                    String(
                        order.status ||
                        "unknown"
                    ).toLowerCase();

                return `
                    <article class="order">

                        <div>

                            <div class="order-title">
                                ${escapeHtml(
                                    order.event?.title ||
                                    "Order"
                                )}
                            </div>

                            <div class="order-id">
                                Order ${escapeHtml(order.id)}
                            </div>

                        </div>

                        <div class="order-date">
                            ${escapeHtml(
                                formatDate(
                                    order.created_at
                                )
                            )}
                        </div>

                        <div
                            class="order-status ${escapeHtml(status)}"
                        >
                            ${escapeHtml(
                                formatStatus(status)
                            )}
                        </div>

                        <a
                            class="view"
                            href="order.html?id=${encodeURIComponent(order.id)}"
                        >
                            View Order
                        </a>

                    </article>
                `;

            }).join("");
    }

    async function loadPage() {

        try {

            initializeSupabase();

            const user =
                await getUser();

            if (!user) {
                return;
            }

            await loadOrders(user);

        } catch (error) {

            console.error(error);

            document
                .getElementById("loading")
                .innerHTML = `
                    <h2>
                        Unable to load orders
                    </h2>

                    <p>
                        ${escapeHtml(
                            error.message ||
                            "Please try again."
                        )}
                    </p>
                `;
        }
    }

    document
        .getElementById("search")
        .addEventListener(
            "input",
            render
        );

    document
        .querySelectorAll(".filter")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".filter")
                        .forEach(btn =>
                            btn.classList.remove(
                                "active"
                            )
                        );

                    button.classList.add(
                        "active"
                    );

                    activeFilter =
                        button.dataset.filter;

                    render();
                }
            );

        });

    loadPage();

</script>

</body>
</html>
