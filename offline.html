<script>
(function(){
  var p=location.pathname;
  var role=p.indexOf('/customer/')===0?'customer':p.indexOf('/merchant/')===0?'merchant':p.indexOf('/admin/')===0?'admin':p.indexOf('/gate/')===0?'gate':'public';
  document.documentElement.dataset.ktRole=role;
  document.addEventListener('DOMContentLoaded',function(){
    document.body.dataset.ktRole=role;
    document.body.dataset.ktPage=p.split('/').pop().replace('.html','');
  });
})();
</script>
