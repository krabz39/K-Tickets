
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | K-Tickets</title>

    <style>

        :root {
            --bordo: #6C151E;
            --bordo-dark: #541018;
            --green: #0F3D3A;
            --cream: #F5DABF;
            --white: #FFFDF9;
            --text: #1D2927;
            --muted: #6D7774;
            --border: rgba(15, 61, 58, 0.14);
            --danger: #A52835;
            --success: #21735D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: grid;
            place-items: center;

            padding: 22px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--cream);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .card {
            width: 100%;
            max-width: 480px;

            padding: clamp(25px, 5vw, 45px);

            border-radius: 25px;

            background: var(--white);

            box-shadow:
                0 25px 70px rgba(15, 61, 58, 0.13);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            color: var(--green);

            font-weight: 900;
        }

        .brand-mark {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: var(--bordo);
            color: var(--cream);

            font-weight: 900;
        }

        .icon {
            width: 58px;
            height: 58px;

            display: grid;
            place-items: center;

            margin-top: 42px;

            border-radius: 17px;

            background: rgba(108, 21, 30, 0.08);
            color: var(--bordo);

            font-size: 25px;
        }

        h1 {
            margin-top: 22px;

            color: var(--green);

            font-size: clamp(30px, 7vw, 42px);
            line-height: 1;

            letter-spacing: -1.5px;
        }

        .intro {
            margin-top: 12px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.6;
        }

        form {
            margin-top: 28px;
        }

        .message {
            display: none;

            margin-bottom: 16px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(165, 40, 53, 0.08);
            color: var(--danger);
        }

        .message.success {
            background: rgba(33, 115, 93, 0.08);
            color: var(--success);
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: var(--green);

            font-size: 13px;
            font-weight: 800;
        }

        input {
            width: 100%;

            min-height: 53px;

            padding: 0 15px;

            border:
                1px solid var(--border);

            border-radius: 13px;

            outline: none;

            background: #FFFCF8;
        }

        input:focus {
            border-color: var(--bordo);

            box-shadow:
                0 0 0 4px rgba(108, 21, 30, 0.08);
        }

        button {
            width: 100%;

            min-height: 54px;

            margin-top: 18px;

            border: 0;
            border-radius: 13px;

            background: var(--bordo);
            color: white;

            font-weight: 900;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        button:hover {
            background: var(--bordo-dark);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .back {
            display: block;

            margin-top: 23px;

            text-align: center;

            color: var(--green);

            font-size: 12px;
            font-weight: 800;
        }

        .back:hover {
            color: var(--bordo);
        }

        @media (max-width: 380px) {

            body {
                padding: 13px;
            }

            .card {
                padding: 24px 18px;
                border-radius: 20px;
            }
        }

    </style>
</head>

<body>

<main class="card">

    <a href="index.html" class="brand">

        <span class="brand-mark">
            K
        </span>

        <span>
            K-Tickets
        </span>

    </a>


    <div class="icon">
        ↻
    </div>


    <h1>
        Forgot your password?
    </h1>


    <p class="intro">
        Enter the email address connected to your K-Tickets
        account and we'll send you a secure password reset link.
    </p>


    <form id="resetRequestForm" novalidate>

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
        ></div>


        <label for="email">
            Email address
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
        >


        <button
            type="submit"
            id="submitButton"
        >
            Send reset link
        </button>

    </form>


    <a href="login.html" class="back">
        ← Back to sign in
    </a>

</main>


<script>

    const form =
        document.getElementById(
            "resetRequestForm"
        );

    const email =
        document.getElementById("email");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("submitButton");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message show " + type;

    }


    form.addEventListener("submit", event => {

        event.preventDefault();

        message.className = "message";

        const value =
            email.value.trim();


        if (!value || !value.includes("@")) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Sending...";


        /*
            SUPABASE PASSWORD RESET
            WILL BE CONNECTED HERE.
        */

        setTimeout(() => {

            button.disabled = false;

            button.textContent =
                "Send reset link";

            showMessage(
                "The password reset service will be connected to your K-Tickets account next.",
                "success"
            );

        }, 700);

    });

</script>

</body>
</html>
