<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | K-Tickets</title>

    <meta
        name="description"
        content="K-Tickets customer notifications."
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bordo: #6C151E;
            --green: #0F3D3A;
            --cream: #F5DABF;

            --white: #ffffff;
            --bg: #faf7f3;
            --surface: #ffffff;
            --surface-soft: #f7f1eb;

            --text: #1e1b19;
            --muted: #746d68;
            --border: #e8ded6;

            --success: #287a59;
            --warning: #b7791f;
            --danger: #a52832;

            --shadow:
                0 12px 35px rgba(36, 25, 19, 0.08);

            --radius: 18px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           LAYOUT
        ========================= */

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 260px;
            background: var(--green);
            color: var(--white);

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            z-index: 1000;

            display: flex;
            flex-direction: column;

            transition:
                transform 0.25s ease,
                width 0.25s ease;
        }

        .brand {
            padding: 26px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.10);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: rgba(255,255,255,0.60);
            font-size: 12px;
        }

        .nav {
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 13px;

            min-height: 46px;
            padding: 11px 13px;

            border-radius: 12px;

            color: rgba(255,255,255,0.72);

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.08);
            color: var(--white);
        }

        .nav-link.active {
            background: rgba(245,218,191,0.13);
            color: var(--cream);
        }

        .nav-icon {
            width: 21px;
            text-align: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.10);
        }

        .signout-btn {
            width: 100%;
            border: 0;
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.78);

            border-radius: 12px;
            padding: 12px;

            font-weight: 600;
        }

        .signout-btn:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 260px;
            width: calc(100% - 260px);
            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 76px;

            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            position: sticky;
            top: 0;
            z-index: 500;

            backdrop-filter: blur(12px);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .mobile-menu {
            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            background: var(--white);

            border-radius: 10px;
            color: var(--green);

            font-size: 20px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--green);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notification-top {
            position: relative;

            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            background: var(--white);

            border-radius: 12px;

            display: grid;
            place-items: center;

            font-size: 18px;
        }

        .notification-top:hover {
            border-color: var(--cream);
        }

        .notification-badge {
            position: absolute;

            min-width: 18px;
            height: 18px;

            padding: 0 4px;

            background: var(--bordo);
            color: white;

            border-radius: 999px;

            top: -4px;
            right: -4px;

            font-size: 10px;
            font-weight: 800;

            display: none;
            align-items: center;
            justify-content: center;
        }

        .profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;

            padding-left: 8px;
        }

        .avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: var(--cream);
            color: var(--green);

            display: grid;
            place-items: center;

            font-size: 14px;
            font-weight: 800;
        }

        .profile-name {
            font-size: 13px;
            font-weight: 700;
            max-width: 160px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-role {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 34px 32px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;

            margin-bottom: 26px;
        }

        .page-header h1 {
            font-size: clamp(28px, 4vw, 38px);
            color: var(--green);
            letter-spacing: -1px;
        }

        .page-header p {
            margin-top: 7px;
            color: var(--muted);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            border-radius: 11px;

            padding: 11px 16px;

            font-size: 13px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--green);
            color: white;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--green);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: #fff1f1;
            color: var(--danger);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           FILTER BAR
        ========================= */

        .filter-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);

            padding: 15px;

            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 18px;

            box-shadow: 0 5px 20px rgba(36,25,19,0.03);
        }

        .search {
            flex: 1;
            min-width: 180px;

            position: relative;
        }

        .search input {
            width: 100%;

            border: 1px solid var(--border);
            background: var(--surface-soft);

            border-radius: 11px;

            padding: 11px 13px 11px 39px;

            outline: none;

            color: var(--text);
        }

        .search input:focus {
            border-color: var(--green);
            background: white;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);
            font-size: 15px;
        }

        .filter-select {
            border: 1px solid var(--border);
            background: white;

            border-radius: 11px;

            padding: 11px 12px;

            color: var(--text);
            outline: none;

            min-width: 135px;
        }

        .filter-select:focus {
            border-color: var(--green);
        }

        /* =========================
           NOTIFICATION LIST
        ========================= */

        .notifications-card {
            background: var(--white);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            overflow: hidden;

            box-shadow: var(--shadow);
        }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border-bottom: 1px solid var(--border);
        }

        .list-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--green);
        }

        .notification-count {
            color: var(--muted);
            font-size: 12px;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
        }

        .notification {
            display: flex;
            gap: 15px;

            padding: 19px 20px;

            border-bottom: 1px solid var(--border);

            position: relative;

            transition:
                background 0.2s ease;
        }

        .notification:last-child {
            border-bottom: 0;
        }

        .notification:hover {
            background: #fdfaf7;
        }

        .notification.unread {
            background: #fffaf4;
        }

        .notification.unread:hover {
            background: #fff6ed;
        }

        .notification-icon {
            width: 43px;
            height: 43px;

            border-radius: 13px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            background: #f0e8e0;
            color: var(--green);

            font-size: 18px;
        }

        .notification-icon.success {
            background: #e8f5ee;
            color: var(--success);
        }

        .notification-icon.warning {
            background: #fff4df;
            color: var(--warning);
        }

        .notification-icon.danger {
            background: #fff0f0;
            color: var(--danger);
        }

        .notification-body {
            flex: 1;
            min-width: 0;
        }

        .notification-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .notification-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
        }

        .notification.unread .notification-title {
            color: var(--green);
        }

        .notification-time {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .notification-message {
            margin-top: 5px;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;

            max-width: 750px;
        }

        .notification-actions {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 10px;
        }

        .notification-action {
            border: 0;
            background: transparent;

            color: var(--green);

            font-size: 12px;
            font-weight: 700;

            padding: 4px 0;
        }

        .notification-action:hover {
            text-decoration: underline;
        }

        .notification-delete {
            color: var(--muted);
        }

        .notification-delete:hover {
            color: var(--danger);
        }

        .unread-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--bordo);

            position: absolute;
            left: 7px;
            top: 24px;
        }

        /* =========================
           EMPTY / LOADING / ERROR
        ========================= */

        .state {
            padding: 65px 25px;
            text-align: center;
        }

        .state-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: var(--surface-soft);
            color: var(--green);

            display: grid;
            place-items: center;

            font-size: 27px;
        }

        .state h3 {
            color: var(--green);
            font-size: 17px;
        }

        .state p {
            margin-top: 7px;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .state .btn {
            margin-top: 18px;
        }

        .spinner {
            width: 32px;
            height: 32px;

            border: 3px solid var(--border);
            border-top-color: var(--green);

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           TOAST
        ========================= */

        .toast-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 3000;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 260px;
            max-width: 360px;

            padding: 13px 15px;

            background: var(--green);
            color: white;

            border-radius: 12px;

            box-shadow: 0 15px 35px rgba(0,0,0,0.15);

            font-size: 13px;
            font-weight: 600;

            animation: toastIn 0.25s ease;
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.success {
            background: var(--success);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBILE OVERLAY
        ========================= */

        .overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.38);

            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                width: 100%;
            }

            .mobile-menu {
                display: grid;
                place-items: center;
            }

            .topbar {
                padding: 0 20px;
            }

            .content {
                padding: 28px 20px 50px;
            }

            .profile-name-wrap {
                display: none;
            }
        }

        @media (max-width: 650px) {

            .topbar {
                height: 68px;
            }

            .page-title {
                font-size: 17px;
            }

            .profile-mini {
                display: none;
            }

            .content {
                padding: 22px 14px 45px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }

            .filter-card {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }

            .filter-select {
                width: 100%;
            }

            .notification {
                padding: 17px 15px;
                gap: 11px;
            }

            .notification-icon {
                width: 38px;
                height: 38px;
                border-radius: 11px;
                font-size: 16px;
            }

            .notification-title-row {
                flex-direction: column;
                gap: 3px;
            }

            .notification-time {
                font-size: 10px;
            }

            .unread-dot {
                left: 4px;
                top: 22px;
            }

            .toast-container {
                left: 14px;
                right: 14px;
                bottom: 14px;
            }

            .toast {
                min-width: 0;
                max-width: none;
            }
        }

        @media (max-width: 400px) {

            .topbar-right {
                gap: 5px;
            }

            .notification-top {
                width: 38px;
                height: 38px;
            }

            .mobile-menu {
                width: 38px;
                height: 38px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .notification-message {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-name">K-Tickets</div>
            <div class="brand-subtitle">Customer Portal</div>
        </div>

        <nav class="nav">

            <a href="./dashboard.html" class="nav-link">
                <span class="nav-icon">⌂</span>

            </a>

            <a href="./events.html" class="nav-link">
                <span class="nav-icon">◫</span>
                <span>Browse Events</span>
            </a>

            <a href="./orders.html" class="nav-link">
                <span class="nav-icon">▤</span>
                <span>My Orders</span>
            </a>

            <a href="./my-tickets.html" class="nav-link">
                <span class="nav-icon">🎟</span>
                <span>My Tickets</span>
            </a>

            <a href="./notifications.html" class="nav-link active">
                <span class="nav-icon">♢</span>
                <span>Notifications</span>
                <span
                    id="sidebarNotificationBadge"
                    class="notification-badge"
                    style="position:static;margin-left:auto;"
                ></span>

            <a href="./profile.html" class="nav-link">

        </nav>

        <div class="sidebar-bottom">

    </aside>


    <div class="overlay" id="overlay"></div>


    <!-- =========================

    ========================== -->

    <main class="main">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <div class="page-title">

            </div>


            <div class="topbar-right">

                <button
                    class="notification-top"

                <div class="profile-mini">

                    </div>

                    <div class="profile-name-wrap">

                        <div

                        >
                            —
                        </div>

                        <div class="profile-role">

                        </div>

                </div>

            </div>

        </header>


        <section class="content">

            <!-- HEADER -->

            <div class="page-header">

                <div>
                    <h1>Notifications</h1>

                    <p>
                        Stay updated with your K-Tickets activity.
                    </p>
                </div>

                <div class="header-actions">

                    <button
                        class="btn btn-secondary"

                    </button>

                    <button

            <!-- FILTERS -->

            <div class="filter-card">

                    <input

                </div>

                    class="filter-select"

                >
                    <option value="all">All notifications</option>

                </div>

            </div>

        </section>

    </main>

</div>


<div
    class="toast-container"
    id="toastContainer"
></div>


<script>
    /* =========================================================
       K-TICKETS CUSTOMER NOTIFICATIONS
       Supabase is the source of truth.
       No notification data is hardcoded.
    ========================================================= */


    /* =========================================================
       SUPABASE CONFIG
    ========================================================= */

    const SUPABASE_URL =
        window.KTICKETS_SUPABASE_URL || "";

    const SUPABASE_ANON_KEY =
        window.KTICKETS_SUPABASE_ANON_KEY || "";


    let supabaseClient = null;

    if (
        SUPABASE_URL &&
        SUPABASE_ANON_KEY &&
        window.supabase
    ) {

        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

    }


    /* =========================================================
       STATE
    ========================================================= */

    let currentUser = null;
    let currentProfile = null;

    let notifications = [];

    let filteredNotifications = [];


    /* =========================================================
       DOM
    ========================================================= */

    const notificationList =
        document.getElementById("notificationList");

    const notificationCount =
        document.getElementById("notificationCount");

    const searchInput =
        document.getElementById("searchInput");

    const statusFilter =
        document.getElementById("statusFilter");

    const markAllBtn =
        document.getElementById("markAllBtn");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const signOutBtn =
        document.getElementById("signOutBtn");

    const profileName =
        document.getElementById("profileName");

    const avatar =
        document.getElementById("avatar");

    const topNotificationBadge =
        document.getElementById("topNotificationBadge");

    const sidebarNotificationBadge =
        document.getElementById("sidebarNotificationBadge");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");

    const toastContainer =
        document.getElementById("toastContainer");


    /* =========================================================
       INITIALIZE
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        initialize
    );


    async function initialize() {

        bindEvents();

        if (!supabaseClient) {

            showState(
                "Configuration required",
                "Supabase credentials have not been configured for this page.",
                "⚙"
            );

            return;
        }


        try {

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if (
                error ||
                !data ||
                !data.user
            ) {

                redirectToLogin();

                return;
            }


            currentUser = data.user;


            await loadProfile();

            await loadNotifications();

        } catch (error) {

            console.error(error);

            showState(
                "Unable to load notifications",
                "Something went wrong while connecting to your account.",
                "!"
            );

        }
    }


    /* =========================================================
       EVENTS
    ========================================================= */

    function bindEvents() {

        searchInput.addEventListener(
            "input",
            applyFilters
        );


        statusFilter.addEventListener(
            "change",
            applyFilters
        );


        markAllBtn.addEventListener(
            "click",
            markAllAsRead
        );


        refreshBtn.addEventListener(
            "click",
            loadNotifications
        );


        signOutBtn.addEventListener(
            "click",
            signOut
        );


        mobileMenu.addEventListener(
            "click",
            openSidebar
        );


        overlay.addEventListener(
            "click",
            closeSidebar
        );

    }


    /* =========================================================
       PROFILE
    ========================================================= */

    async function loadProfile() {

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                phone,
                role
            `)
            .eq("id", currentUser.id)
            .maybeSingle();


        if (error) {

            console.warn(
                "Profile query warning:",
                error
            );

            return;
        }


        currentProfile = data;


        if (!currentProfile) {
            return;
        }


        const name =
            currentProfile.full_name ||
            currentUser.user_metadata?.full_name ||
            currentUser.email?.split("@")[0] ||
            "Customer";


        profileName.textContent = name;


        const initials =
            getInitials(name);

        avatar.textContent = initials;

    }


    /* =========================================================
       LOAD NOTIFICATIONS
       
       EXPECTED TABLE:
       
       notifications
       ----------------------------
       id
       user_id
       title
       message
       type
       is_read
       action_url
       created_at
       ========================================================= */

    async function loadNotifications() {

        if (!currentUser) {
            return;
        }


        showLoading();


        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("notifications")
                .select(`
                    id,
                    user_id,
                    title,
                    message,
                    type,
                    is_read,
                    action_url,
                    created_at
                `)
                .eq(
                    "user_id",
                    currentUser.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {
                throw error;
            }


            notifications =
                Array.isArray(data)
                    ? data
                    : [];


            updateUnreadBadge();

            applyFilters();

        } catch (error) {

            console.error(
                "Notification loading error:",
                error
            );


            showState(
                "Notifications unavailable",
                error.message ||
                "We could not load your notifications.",
                "!"
            );

        }

    }


    /* =========================================================
       FILTERS
    ========================================================= */

    function applyFilters() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const status =
            statusFilter.value;


        filteredNotifications =
            notifications.filter(notification => {

                const title =
                    String(
                        notification.title || ""
                    ).toLowerCase();


                const message =
                    String(
                        notification.message || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    title.includes(search) ||
                    message.includes(search);


                const isRead =
                    Boolean(
                        notification.is_read
                    );


                const matchesStatus =
                    status === "all" ||
                    (status === "read" && isRead) ||
                    (status === "unread" && !isRead);


                return (
                    matchesSearch &&
                    matchesStatus
                );

            });


        renderNotifications();

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderNotifications() {

        notificationCount.textContent =
            `${filteredNotifications.length} ${
                filteredNotifications.length === 1
                    ? "notification"
                    : "notifications"
            }`;


        if (
            filteredNotifications.length === 0
        ) {

            if (
                notifications.length === 0
            ) {

                showState(
                    "No notifications yet",
                    "Your K-Tickets updates will appear here.",
                    "♢"
                );

            } else {

                showState(
                    "No matching notifications",
                    "Try changing your search or filter.",
                    "⌕"
                );

            }

            return;
        }


        notificationList.innerHTML =
            filteredNotifications
                .map(
                    createNotificationHTML
                )
                .join("");


        document
            .querySelectorAll(
                "[data-notification-id]"
            )
            .forEach(element => {

                const id =
                    element.dataset.notificationId;


                element
                    .querySelector(
                        "[data-action='read']"
                    )
                    ?.addEventListener(
                        "click",
                        () => markAsRead(id)
                    );


                element
                    .querySelector(
                        "[data-action='delete']"
                    )
                    ?.addEventListener(
                        "click",
                        () => deleteNotification(id)
                    );


                element
                    .querySelector(
                        "[data-action='open']"
                    )
                    ?.addEventListener(
                        "click",
                        () => openNotification(id)
                    );

            });

    }


    function createNotificationHTML(
        notification
    ) {

        const id =
            escapeHTML(
                String(notification.id)
            );


        const title =
            escapeHTML(
                notification.title ||
                "Notification"
            );


        const message =
            escapeHTML(
                notification.message ||
                ""
            );


        const type =
            normalizeType(
                notification.type
            );


        const isUnread =
            !notification.is_read;


        const time =
            formatRelativeTime(
                notification.created_at
            );


        const icon =
            getNotificationIcon(type);


        return `
            <article
                class="notification ${isUnread ? "unread" : ""}"
                data-notification-id="${id}"
            >

                ${
                    isUnread
                        ? `<span class="unread-dot"></span>`
                        : ""
                }

                <div
                    class="notification-icon ${type}"
                >
                    ${icon}
                </div>


                <div class="notification-body">

                    <div class="notification-title-row">

                        <div class="notification-title">
                            ${title}
                        </div>

                        <div class="notification-time">
                            ${time}
                        </div>

                    </div>


                    <div class="notification-message">
                        ${message}
                    </div>


                    <div class="notification-actions">

                        ${
                            isUnread
                                ? `
                                    <button
                                        class="notification-action"
                                        data-action="read"
                                    >
                                        Mark as read
                                    </button>
                                `
                                : ""
                        }


                        ${
                            notification.action_url
                                ? `
                                    <button
                                        class="notification-action"
                                        data-action="open"
                                    >
                                        View
                                    </button>
                                `
                                : ""
                        }


                        <button
                            class="notification-action notification-delete"
                            data-action="delete"
                        >
                            Dismiss
                        </button>

                    </div>

                </div>

            </article>
        `;

    }


    /* =========================================================
       MARK ONE AS READ
    ========================================================= */

    async function markAsRead(id) {

        try {

            const {
                error
            } = await supabaseClient
                .from("notifications")
                .update({
                    is_read: true
                })
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {
                throw error;
            }


            const notification =
                notifications.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (notification) {
                notification.is_read = true;
            }


            updateUnreadBadge();

            applyFilters();

        } catch (error) {

            console.error(error);

            showToast(
                "Could not mark notification as read.",
                "error"
            );

        }

    }


    /* =========================================================
       MARK ALL AS READ
    ========================================================= */

    async function markAllAsRead() {

        const unreadCount =
            notifications.filter(
                notification =>
                    !notification.is_read
            ).length;


        if (!unreadCount) {

            showToast(
                "You have no unread notifications.",
                "success"
            );

            return;
        }


        markAllBtn.disabled = true;


        try {

            const {
                error
            } = await supabaseClient
                .from("notifications")
                .update({
                    is_read: true
                })
                .eq(
                    "user_id",
                    currentUser.id
                )
                .eq(
                    "is_read",
                    false
                );


            if (error) {
                throw error;
            }


            notifications =
                notifications.map(
                    notification => ({
                        ...notification,
                        is_read: true
                    })
                );


            updateUnreadBadge();

            applyFilters();


            showToast(
                "All notifications marked as read.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showToast(
                "Could not update your notifications.",
                "error"
            );

        } finally {

            markAllBtn.disabled = false;

        }

    }


    /* =========================================================
       DELETE / DISMISS
    ========================================================= */

    async function deleteNotification(id) {

        try {

            const {
                error
            } = await supabaseClient
                .from("notifications")
                .delete()
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {
                throw error;
            }


            notifications =
                notifications.filter(
                    notification =>
                        String(notification.id) !==
                        String(id)
                );


            updateUnreadBadge();

            applyFilters();


            showToast(
                "Notification dismissed.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showToast(
                "Could not dismiss this notification.",
                "error"
            );

        }

    }


    /* =========================================================
       OPEN NOTIFICATION
    ========================================================= */

    async function openNotification(id) {

        const notification =
            notifications.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!notification) {
            return;
        }


        if (!notification.is_read) {

            try {

                const {
                    error
                } = await supabaseClient
                    .from("notifications")
                    .update({
                        is_read: true
                    })
                    .eq(
                        "id",
                        id
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


                if (!error) {
                    notification.is_read = true;
                }

            } catch (error) {

                console.warn(
                    "Could not update read state:",
                    error
                );

            }

        }


        updateUnreadBadge();

        applyFilters();


        if (
            notification.action_url
        ) {

            const url =
                String(
                    notification.action_url
                );


            if (
                url.startsWith("/") ||
                url.startsWith("./") ||
                url.startsWith("../") ||
                url.startsWith("http://") ||
                url.startsWith("https://")
            ) {

                window.location.href =
                    url;

            }

        }

    }


    /* =========================================================
       BADGES
    ========================================================= */

    function updateUnreadBadge() {

        const unread =
            notifications.filter(
                notification =>
                    !notification.is_read
            ).length;


        updateBadge(
            topNotificationBadge,
            unread
        );


        updateBadge(
            sidebarNotificationBadge,
            unread
        );


        markAllBtn.disabled =
            unread === 0;

    }


    function updateBadge(
        element,
        count
    ) {

        if (!element) {
            return;
        }


        if (count <= 0) {

            element.style.display =
                "none";

            element.textContent = "";

            return;
        }


        element.style.display =
            "flex";


        element.textContent =
            count > 99
                ? "99+"
                : String(count);

    }


    /* =========================================================
       LOADING STATE
    ========================================================= */

    function showLoading() {

        notificationList.innerHTML = `
            <div class="state">

                <div class="spinner"></div>

                <h3>
                    Loading notifications
                </h3>

                <p>
                    Please wait while we load your latest updates.
                </p>

            </div>
        `;

    }


    /* =========================================================
       EMPTY / ERROR STATE
    ========================================================= */

    function showState(
        title,
        message,
        icon
    ) {

        notificationList.innerHTML = `
            <div class="state">

                <div class="state-icon">
                    ${icon}
                </div>

                <h3>
                    ${escapeHTML(title)}
                </h3>

                <p>
                    ${escapeHTML(message)}
                </p>

                <button
                    class="btn btn-secondary"
                    onclick="loadNotifications()"
                >
                    Try again
                </button>

            </div>
        `;

    }


    /* =========================================================
       NOTIFICATION TYPE
    ========================================================= */

    function normalizeType(type) {

        const value =
            String(
                type || ""
            ).toLowerCase();


        if (
            value.includes("success") ||
            value.includes("payment") ||
            value.includes("ticket") ||
            value.includes("confirmed")
        ) {

            return "success";

        }


        if (
            value.includes("warning") ||
            value.includes("pending")
        ) {

            return "warning";

        }


        if (
            value.includes("error") ||
            value.includes("failed") ||
            value.includes("cancel")
        ) {

            return "danger";

        }


        return "";

    }


    function getNotificationIcon(
        type
    ) {

        switch (type) {

            case "success":
                return "✓";

            case "warning":
                return "⌛";

            case "danger":
                return "!";

            default:
                return "♢";

        }

    }


    /* =========================================================
       TIME
    ========================================================= */

    function formatRelativeTime(
        timestamp
    ) {

        if (!timestamp) {
            return "";
        }


        const date =
            new Date(timestamp);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        const now =
            new Date();


        const difference =
            now.getTime() -
            date.getTime();


        const seconds =
            Math.floor(
                difference / 1000
            );


        if (seconds < 60) {
            return "Just now";
        }


        const minutes =
            Math.floor(
                seconds / 60
            );


        if (minutes < 60) {

            return `${minutes} ${
                minutes === 1
                    ? "minute"
                    : "minutes"
            } ago`;

        }


        const hours =
            Math.floor(
                minutes / 60
            );


        if (hours < 24) {

            return `${hours} ${
                hours === 1
                    ? "hour"
                    : "hours"
            } ago`;

        }


        const days =
            Math.floor(
                hours / 24
            );


        if (days < 7) {

            return `${days} ${
                days === 1
                    ? "day"
                    : "days"
            } ago`;

        }


        return date.toLocaleDateString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }


    /* =========================================================
       INITIALS
    ========================================================= */

    function getInitials(name) {

        const parts =
            String(name)
                .trim()
                .split(/\s+/)
                .filter(Boolean);


        if (!parts.length) {
            return "—";
        }


        if (parts.length === 1) {

            return parts[0]
                .slice(0, 2)
                .toUpperCase();

        }


        return (
            parts[0][0] +
            parts[parts.length - 1][0]
        ).toUpperCase();

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHTML(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(
        message,
        type = ""
    ) {

        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            `toast ${type}`;


        toast.textContent =
            message;


        toastContainer.appendChild(
            toast
        );


        setTimeout(
            () => {

                toast.style.opacity =
                    "0";

                toast.style.transform =
                    "translateY(10px)";

                setTimeout(
                    () => toast.remove(),
                    250
                );

            },
            3200
        );

    }


    /* =========================================================
       SIGN OUT
    ========================================================= */

    async function signOut() {

        if (!supabaseClient) {
            return;
        }


        try {

            const {
                error
            } =
                await supabaseClient
                    .auth
                    .signOut();


            if (error) {
                throw error;
            }


            window.location.href =
                "../auth/login.html";

        } catch (error) {

            console.error(error);

            showToast(
                "Could not sign out.",
                "error"
            );

        }

    }


    /* =========================================================
       LOGIN REDIRECT
    ========================================================= */

    function redirectToLogin() {

        const currentPath =
            window.location.pathname +
            window.location.search;


        const redirect =
            encodeURIComponent(
                currentPath
            );


        window.location.href =
            `../auth/login.html?redirect=${redirect}`;

    }


    /* =========================================================
       MOBILE SIDEBAR
    ========================================================= */

    function openSidebar() {

        sidebar.classList.add(
            "open"
        );

        overlay.classList.add(
            "active"
        );

    }


    function closeSidebar() {

        sidebar.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "active"
        );

    }


    /* =========================================================
       OPTIONAL REALTIME UPDATES
       
       This listens for notification inserts/updates/deletes
       belonging to the authenticated customer.
    ========================================================= */

    async function subscribeToNotifications() {

        if (
            !supabaseClient ||
            !currentUser
        ) {
            return;
        }


        supabaseClient
            .channel(
                `customer-notifications-${currentUser.id}`
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "notifications",
                    filter:
                        `user_id=eq.${currentUser.id}`
                },
                () => {

                    loadNotifications();

                }
            )
            .subscribe();

    }


    /*
        Start realtime after authentication.
    */

    const originalInitialize =
        initialize;

</script>
