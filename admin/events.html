/* =========================================================

const SUPABASE_URL =

/* =========================================================
   INITIALIZE SUPABASE
========================================================= */

function initializeSupabase(){

    if(
        !SUPABASE_URL ||
        !SUPABASE_PUBLISHABLE_KEY
    ){
        throw new Error(
            "Supabase configuration is missing."
        );
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );
}


/* =========================================================
   SECURITY GATE
========================================================= */

async function secureAdminGate(){

    try{

        initializeSupabase();

        const {
            data:{
                session
            },
            error:sessionError
        } =
            await supabaseClient.auth.getSession();

        if(sessionError){
            throw sessionError;
        }

        if(!session?.user){

            redirectLogin(
                "session_required"
            );

            return false;
        }

        currentUser =
            session.user;


        /*
        ----------------------------------------------------
        Load the authenticated user's K-Tickets profile.
        ----------------------------------------------------
        */

        const {
            data:profile,
            error:profileError
        } =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    full_name,
                    phone,
                    role,
                    is_active
                `)
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();

        if(profileError){

            throw new Error(
                `Profile query failed: ${profileError.message}`
            );
        }


        if(!profile){

            throw new Error(
                "No K-Tickets profile exists for this authenticated account."
            );
        }


        if(
            profile.role !== "admin" ||
            profile.is_active !== true
        ){

            await safeSignOut();

            redirectLogin(
                "unauthorized"
            );

            return false;
        }


        currentProfile =
            profile;


        applyIdentity();


        securityScreen.style.display =
            "none";

        app.style.display =
            "block";

        return true;

    }catch(error){

        console.error(
            "Admin security verification failed:",
            error
        );

        showSecurityFailure(
            error?.message ||
            "Administrator verification failed."
        );

        return false;
    }
}


/* =========================================================
   ADMIN IDENTITY
========================================================= */

function applyIdentity(){

    const name =
        currentProfile?.full_name ||
        currentUser?.user_metadata?.full_name ||
        "Administrator";


    const nameElement =
        document.getElementById(
            "adminName"
        );

    if(nameElement){
        nameElement.textContent =
            name;
    }


    const initials =
        name
            .trim()
            .split(/\s+/)
            .slice(0,2)
            .map(
                value =>
                    value
                        .charAt(0)
                        .toUpperCase()
            )
            .join("") ||
        "A";


    const avatarElement =
        document.getElementById(
            "adminAvatar"

    if(avatarElement){

    }
}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents(){

    showLoading();
    hideError();

    try{

        /*
        ----------------------------------------------------
        1. EVENTS
        ----------------------------------------------------
        */

        const {
            data:events,
            error:eventError
        } =
            await supabaseClient
                .from("events")
                .select(`
                    id,
                    merchant_id,
                    title,
                    description,
                    venue,
                    city,
                    start_at,
                    end_at,
                    status,
                    created_at,
                    updated_at
                `)
                .order(
                    "start_at",
                    {
                        ascending:true,
                        nullsFirst:false
                    }
                );


        if(eventError){

            throw new Error(
                `Events query failed: ${eventError.message}`
            );
        }


        allEvents =
            Array.isArray(events)
                ? events
                : [];


        /*
        ----------------------------------------------------
        2. TICKET TYPES
        ----------------------------------------------------

        Ticket inventory is loaded from the real
        ticket_types table.

        Nothing is generated locally.
        ----------------------------------------------------
        */

        const eventIds =
            allEvents
                .map(event => event.id)
                .filter(Boolean);


        allTicketTypes = [];


        if(eventIds.length){

            const {
                data:ticketTypes,
                error:ticketError
            } =
                await supabaseClient
                    .from("ticket_types")
                    .select(`
                        id,
                        event_id,
                        name,
                        description,
                        price,
                        currency,
                        quantity_total,
                        quantity_sold,
                        sales_start,
                        sales_end,
                        active,
                        created_at,
                        updated_at
                    `)
                    .in(
                        "event_id",
                        eventIds
                    );


            if(ticketError){

                /*
                Ticket information is useful but should not
                prevent the event directory from displaying
                if RLS has not yet been configured for it.
                */

                console.warn(
                    "Ticket types could not be loaded:",
                    ticketError
                );

                allTicketTypes = [];

            }else{

                allTicketTypes =
                    Array.isArray(ticketTypes)
                        ? ticketTypes
                        : [];
            }
        }


        /*
        ----------------------------------------------------
        3. MERCHANT PROFILES
        ----------------------------------------------------

        Resolve merchant UUIDs into actual names.

        We never hardcode merchant names.
        ----------------------------------------------------
        */

        const merchantIds =
            [
                ...new Set(
                    allEvents
                        .map(event =>
                            event.merchant_id
                        )
                        .filter(Boolean)
                )
            ];


        merchantProfiles = [];
        merchantMap = new Map();


        if(merchantIds.length){

            const {
                data:profiles,
                error:merchantError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(`
                        id,
                        full_name,
                        phone,
                        role,
                        is_active
                    `)
                    .in(
                        "id",
                        merchantIds
                    );


            if(merchantError){

                console.warn(
                    "Merchant profiles could not be loaded:",
                    merchantError
                );

            }else{

                merchantProfiles =
                    Array.isArray(profiles)
                        ? profiles
                        : [];


                merchantProfiles.forEach(
                    merchant => {

                        merchantMap.set(
                            merchant.id,
                            merchant
                        );
                    }
                );
            }
        }


        /*
        ----------------------------------------------------
        4. GROUP TICKET TYPES BY EVENT
        ----------------------------------------------------
        */

        ticketTypesByEvent =
            new Map();


        allTicketTypes.forEach(
            ticketType => {

                if(
                    !ticketTypesByEvent.has(
                        ticketType.event_id
                    )
                ){

                    ticketTypesByEvent.set(
                        ticketType.event_id,
                        []
                    );
                }


                ticketTypesByEvent
                    .get(ticketType.event_id)
                    .push(ticketType);
            }
        );


        updateStats();
        renderEvents();

    }catch(error){

        console.error(
            "Events loading failed:",
            error
        );

        allEvents = [];
        allTicketTypes = [];

        ticketTypesByEvent =
            new Map();

        merchantMap =
            new Map();

        updateStats();
        renderEvents();


        showError(
            error?.message ||
            "Events could not be loaded."
        );
    }
}


/* =========================================================
   EVENT INVENTORY
========================================================= */

function getEventTicketTypes(eventId){

    return (
        ticketTypesByEvent.get(
            eventId
        ) || []
    );
}


function getEventInventory(eventId){

    const ticketTypes =
        getEventTicketTypes(
            eventId
        );


    const total =
        ticketTypes.reduce(
            (sum,ticket) =>
                sum +
                Number(
                    ticket.quantity_total || 0
                ),
            0
        );


    const sold =
        ticketTypes.reduce(
            (sum,ticket) =>
                sum +
                Number(
                    ticket.quantity_sold || 0
                ),
            0
        );


    const available =
        Math.max(
            total - sold,
            0
        );


    return {
        total,
        sold,
        available,
        ticketTypeCount:
            ticketTypes.length
    };
}


/* =========================================================
   MERCHANT DISPLAY
========================================================= */

function getMerchantName(event){

    if(!event?.merchant_id){
        return "—";
    }


    const merchant =
        merchantMap.get(
            event.merchant_id
        );


    if(!merchant){
        return "Merchant profile unavailable";
    }


    return (
        merchant.full_name ||
        "Unnamed merchant"
    );
}


/* =========================================================
   RENDER
========================================================= */

function renderEvents(){

    let filtered =
        [...allEvents];


    const search =
        String(
            searchInput?.value || ""
        )
        .trim()
        .toLowerCase();


    const status =
        String(
            statusFilter?.value || ""
        )
        .trim()
        .toLowerCase();


    const date =
        String(
            dateFilter?.value || "all"
        );


    /*
    ----------------------------------------------------
    SEARCH
    ----------------------------------------------------
    */

    if(search){

        filtered =
            filtered.filter(
                event => {

                    const merchantName =
                        getMerchantName(
                            event
                        );


                    const inventory =
                        getEventInventory(
                            event.id
                        );


                    const haystack = [

                        event.id,

                        event.title,

                        event.description,

                        event.venue,

                        event.city,

                        event.status,

                        event.merchant_id,

                        merchantName,

                        inventory.total,

                        inventory.sold,

                        inventory.available

                    ]
                    .filter(
                        value =>
                            value !== null &&
                            value !== undefined
                    )
                    .join(" ")
                    .toLowerCase();


                    return haystack.includes(
                        search
                    );
                }
            );
    }


    /*
    ----------------------------------------------------
    STATUS FILTER
    ----------------------------------------------------
    */

    if(status){

        filtered =
            filtered.filter(
                event =>
                    String(
                        event.status || ""
                    )
                    .toLowerCase() ===
                    status
            );
    }


    /*
    ----------------------------------------------------
    DATE FILTER
    ----------------------------------------------------
    */

    if(date !== "all"){

        const now =
            Date.now();


        filtered =
            filtered.filter(
                event => {

                    if(!event.start_at){
                        return false;
                    }


                    const timestamp =
                        new Date(
                            event.start_at
                        ).getTime();


                    if(
                        Number.isNaN(
                            timestamp
                        )
                    ){
                        return false;
                    }


                    if(
                        date === "upcoming"
                    ){

                        return (
                            timestamp >= now
                        );
                    }


                    if(
                        date === "past"
                    ){

                        return (
                            timestamp < now
                        );
                    }


                    return true;
                }
            );
    }


    renderDesktop(
        filtered
    );

    renderMobile(
        filtered
    );
}

/* =========================================================
   STATISTICS
========================================================= */

function updateStats(){

    const total =
        allEvents.length;


    const active =
        allEvents.filter(
            event => {

                const status =
                    String(
                        event.status || ""
                    )
                    .toLowerCase();

                return (
                    status === "active" ||
                    status === "published"
                );
            }
        ).length;


    const draft =
        allEvents.filter(
            event =>
                String(
                    event.status || ""
                )
                .toLowerCase() ===
                "draft"
        ).length;


    const cancelled =
        allEvents.filter(
            event =>
                String(
                    event.status || ""
                )
                .toLowerCase() ===
                "cancelled"
        ).length;


    setText(
        "totalEvents",
        total.toLocaleString()
    );

    setText(
        "activeEvents",
        active.toLocaleString()
    );

    setText(
        "draftEvents",
        draft.toLocaleString()
    );

    setText(
        "cancelledEvents",
        cancelled.toLocaleString()
    );
}


/* =========================================================
   EVENT ACTIONS
========================================================= */

async function handleAction(
    action,
    id
){

    const event =
        allEvents.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!event){
        return;
    }


    /*
    ----------------------------------------------------
    VIEW
    ----------------------------------------------------
    */

    if(action === "view"){

        /*
        We keep the existing page as the event directory.
        The ID is passed through the URL so a future secure
        event-details page can consume it dynamically.
        */

        window.location.href =
            "./events.html?id=" +
            encodeURIComponent(
                event.id
            );

        return;
    }


    /*
    ----------------------------------------------------
    ARCHIVE / RESTORE
    ----------------------------------------------------
    */

    if(action === "archive"){

        const currentlyArchived =
            isArchived(event);


        const nextStatus =
            currentlyArchived
                ? "draft"
                : "archived";


        const message =
            currentlyArchived
                ? "Restore this event to draft status?"
                : "Archive this event?";


        if(
            !window.confirm(
                message
            )
        ){
            return;
        }


        try{

            /*
            IMPORTANT:
            PostgreSQL RLS must independently verify that
            this authenticated user is permitted to update
            the event.

            No service-role credentials are used here.
            */

            const {
                error:updateError
            } =
                await supabaseClient
                    .from("events")
                    .update({
                        status:
                            nextStatus,

                        updated_at:
                            new Date()
                                .toISOString()
                    })
                    .eq(
                        "id",
                        event.id
                    );


            if(updateError){

                throw updateError;
            }


            /*
            ------------------------------------------------
            Optional audit record.

            If the current RLS configuration permits admin
            audit inserts, record the change. Failure here
            does NOT falsely report that the event update
            failed because the event update already succeeded.
            ------------------------------------------------
            */

            try{

                await supabaseClient
                    .from("audit_logs")
                    .insert({
                        actor_id:
                            currentUser.id,

                        action:
                            currentlyArchived
                                ? "event_restored"
                                : "event_archived",

                        entity_type:
                            "event",

                        entity_id:
                            event.id,

                        old_data:{
                            status:
                                event.status
                        },

                        new_data:{
                            status:
                                nextStatus
                        },

                        user_agent:
                            navigator.userAgent
                    });

            }catch(auditError){

                console.warn(
                    "Audit log could not be written:",
                    auditError
                );
            }


            await loadEvents();

        }catch(error){

            console.error(
                "Event status update failed:",
                error
            );


            showError(
                error?.message ||
                "The event could not be updated. The server rejected the operation."
            );
        }
    }
}

/* =========================================================
   AUTH SESSION MONITOR
========================================================= */

function monitorAuth(){

    if(!supabaseClient){
        return;
    }


    supabaseClient.auth.onAuthStateChange(
        (
            event,
            session
        ) => {

            if(
                event === "SIGNED_OUT" ||
                event === "USER_DELETED" ||
                !session
            ){

                window.location.replace(
                    "/login.html?error=session_expired"
                );
            }
        }
    );
}


/* =========================================================
   STATUS HELPERS
========================================================= */

function normalizeStatus(status){

    const value =
        String(
            status || ""
        )
        .toLowerCase()
        .trim();


    /*
    These are UI states already used by the K-Tickets
    event workflow. They do not create database records.
    */

    const allowed = [
        "active",
        "published",
        "draft",
        "cancelled",
        "archived"
    ];


    return allowed.includes(
        value
    )
        ? value
        : "draft";
}


function isArchived(event){

    return (
        String(
            event?.status || ""
        )
        .toLowerCase() ===
        "archived"
    );
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

    if(!value){
        return "—";
    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "—";
    }


    return date.toLocaleString(
        undefined,
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );
}


/* =========================================================
   SAFE TEXT
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


/* =========================================================
   DOM TEXT HELPER
========================================================= */

function setText(
    id,
    value
){

    const element =
        document.getElementById(
            id
        );


    if(element){
        element.textContent =
            value;
    }
}

/* =========================================================
   ERROR
========================================================= */

function showError(message){

    if(!errorBox){
        return;
    }


    errorBox.hidden =
        false;

    errorBox.textContent =
        message;
}


function hideError(){

    if(!errorBox){
        return;
    }


    errorBox.hidden =
        true;

    errorBox.textContent =
        "";
}

        if(supabaseClient){

        }

/* =========================================================
   LOGIN REDIRECT
========================================================= */

function redirectLogin(
    reason = "unauthorized"
){

    window.location.replace(
        "/login.html?error=" +
        encodeURIComponent(
            reason
        )
    );
}


/* =========================================================
   SECURITY FAILURE
========================================================= */

function showSecurityFailure(
    technicalMessage = ""
){

    const safeMessage =
        escapeHTML(
            technicalMessage
        );


    securityScreen.innerHTML = `

        <div class="security-box">

            <div class="security-logo">
                !
            </div>

            <h1>
                Access Unavailable
            </h1>

            <p>
                This administrator session could not
                be verified. Please sign in again.
            </p>

            ${
                safeMessage
                    ? `
                        <p
                            style="
                                margin-top:12px;
                                opacity:.65;
                                font-size:11px;
                                word-break:break-word;
                            "
                        >
                            ${safeMessage}
                        </p>
                    `
                    : ""
            }

            <button
                type="button"
                onclick="
                    window.location.replace(
                        '/login.html?error=admin_verification'
                    )
                "
                style="
                    margin-top:22px;
                    padding:12px 18px;
                    border:0;
                    border-radius:10px;
                    background:#F5DABF;
                    color:#0F3D3A;
                    font-weight:800;
                    cursor:pointer;
                "
            >
                Return to Login
            </button>

        </div>
    `;

    securityScreen.style.display =
        "flex";

    app.style.display =
        "none";
}

(async function(){

    try{

        const authorized =
            await secureAdminGate();


        if(!authorized){
            return;
        }


        monitorAuth();


        await loadEvents();

    }catch(error){

        console.error(
            "K-Tickets Events initialization failed:",
            error
        );


        showSecurityFailure(
            error?.message ||
            "The Events administration page could not initialize."
        );
    }

})();
