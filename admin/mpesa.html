/* ============================================================
   CONFIGURATION

const SUPABASE_URL =
    "https://mdzlfejdvifxxsreuzwz.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_MxmMaG9dr2IhvDF1PSwT4Q_KUflsVA6";


/* ============================================================
   STATE
============================================================ */

let supabaseClient = null;

let currentUser = null;
let currentProfile = null;

let allPayments = [];
let filteredPayments = [];

let currentPage = 1;

const PAGE_SIZE = 30;


/* ============================================================
   DOM HELPER
============================================================ */

const $ = id =>
    document.getElementById(id);


/* ============================================================
   HTML SAFETY
============================================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function safeText(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "—";
    }

    return String(value);
}


/* ============================================================
   TOAST
============================================================ */

function showToast(
    message,
    type = ""
){

    const toast =
        $("toast");

    if(!toast){
        return;
    }

    toast.textContent =
        message;

    toast.className =
        "toast show " + type;

    clearTimeout(
        window.__kticketsToast
    );

    window.__kticketsToast =
        setTimeout(
            () => {
                toast.className =
                    "toast";
            },
            3500
        );
}


/* ============================================================
   LOGIN REDIRECT
============================================================ */

function redirectLogin(
    reason = ""
){

    const suffix =
        reason
            ? "?error=" +
              encodeURIComponent(reason)
            : "";

    window.location.replace(
        "/login.html" + suffix
    );
}


/* ============================================================
   SIGN OUT
============================================================ */

async function safeSignOut(){

    try{

        if(supabaseClient){

            await supabaseClient
                .auth
                .signOut();
        }

    }catch(error){

        console.warn(
            "Sign out warning:",
            error
        );
    }

    redirectLogin(
        "signed_out"
    );
}


/* ============================================================
   DATE FORMATTERS
============================================================ */

function formatDate(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return safeText(value);
    }

    return new Intl.DateTimeFormat(
        undefined,
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    ).format(date);
}


function formatDateShort(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return safeText(value);
    }

    return new Intl.DateTimeFormat(
        undefined,
        {
            dateStyle:"medium"
        }
    ).format(date);
}


/* ============================================================
   AMOUNT FORMATTER
============================================================ */

function formatAmount(
    amount,
    currency
){

    if(
        amount === null ||
        amount === undefined ||
        amount === ""
    ){
        return "—";
    }

    const numeric =
        Number(amount);

    if(
        !Number.isFinite(numeric)
    ){
        return escapeHtml(
            amount
        );
    }

    const prefix =
        currency
            ? escapeHtml(
                String(currency)
                    .toUpperCase()
              ) + " "
            : "";

    return (
        prefix +
        numeric.toLocaleString(
            undefined,
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        )
    );
}


/* ============================================================
   STATUS NORMALIZATION
============================================================ */

function normalizeStatus(
    payment
){

    const raw =
        String(
            payment?.status ||
            ""
        )
        .toLowerCase()
        .trim();


    /*
        Our real payments table uses:
        pending
        processing
        paid
        failed
        cancelled
        refunded
    */

    if(raw === "paid"){
        return "success";
    }

    if(
        raw === "pending" ||
        raw === "processing"
    ){
        return "pending";
    }

    if(raw === "failed"){
        return "failed";
    }

    if(raw === "cancelled"){
        return "cancelled";
    }

    if(raw === "refunded"){
        return "refunded";
    }

    return raw || "unknown";
}


function statusLabel(
    status
){

    const labels = {

        success:
            "Successful",

        pending:
            "Pending",

        failed:
            "Failed",

        cancelled:
            "Cancelled",

        refunded:
            "Refunded",

        unknown:
            "Unknown"
    };

    return (
        labels[status] ||
        status
    );
}


function statusClass(
    status
){

    if(
        status === "success"
    ){
        return "success";
    }

    if(
        status === "pending"
    ){
        return "warning";
    }

    if(
        status === "failed" ||
        status === "cancelled" ||
        status === "refunded"
    ){
        return "danger";
    }

    return "neutral";
}


function statusBadge(
    status
){

    return `
        <span class="badge ${escapeHtml(
            statusClass(status)
        )}">
            ${escapeHtml(
                statusLabel(status)
            )}
        </span>
    `;
}


/* ============================================================
   INITIALIZE SUPABASE
============================================================ */

function initializeSupabase(){

    if(
        !SUPABASE_URL ||
        !SUPABASE_PUBLISHABLE_KEY
    ){
        throw new Error(
            "Supabase configuration is missing."
        );
    }

    if(
        !window.supabase ||
        !window.supabase.createClient
    ){
        throw new Error(
            "Supabase client failed to load."
        );
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );
}


/* ============================================================
   ADMIN SECURITY GATE
============================================================ */

async function verifyAdmin(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();

    if(error){
        throw new Error(
            `Session verification failed: ${error.message}`
        );
    }

    const session =
        data?.session;

    if(!session?.user){

        redirectLogin(
            "login_required"
        );

        return false;
    }

    currentUser =
        session.user;


    const {
        data:profile,
        error:profileError
    } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                phone,
                role,
                is_active
            `)
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if(profileError){

        throw new Error(
            `Profile verification failed: ${profileError.message}`
        );
    }


    if(!profile){

        throw new Error(
            "No K-Tickets profile exists for this account."
        );
    }


    if(
        profile.role !== "admin" ||
        profile.is_active !== true
    ){

        await safeSignOut();

        return false;
    }


    currentProfile =
        profile;

    updateAdminIdentity();

    return true;
}


/* ============================================================
   ADMIN IDENTITY
============================================================ */

function updateAdminIdentity(){

    const name =
        currentProfile?.full_name ||
        currentUser?.user_metadata?.full_name ||
        "Administrator";


    const nameElement =
        $("sidebarAdminName");

    if(nameElement){
        nameElement.textContent =
            name;
    }


    const avatar =
        $("sidebarAvatar");

    if(avatar){
        avatar.textContent =
            getInitials(name);
    }
}


function getInitials(
    name
){

    const value =
        String(
            name || "A"
        )
        .trim();


    if(!value){
        return "A";
    }


    const parts =
        value
            .split(/\s+/)
            .filter(Boolean);


    if(parts.length === 1){

        return parts[0]
            .slice(0,2)
            .toUpperCase();
    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();
}


/* ============================================================
   LOAD EVENT NAMES
============================================================ */

async function loadEventMap(
    eventIds
){

    const map =
        new Map();


    const ids =
        [
            ...new Set(
                eventIds
                    .filter(Boolean)
                    .map(
                        id => String(id)
                    )
            )
        ];


    if(!ids.length){
        return map;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("events")
            .select(`
                id,
                title
            `)
            .in(
                "id",
                ids
            );


    if(error){

        console.warn(
            "Event lookup unavailable:",
            error
        );

        return map;
    }


    (data || [])
        .forEach(
            event => {

                map.set(
                    String(event.id),
                    event.title ||
                    ""
                );
            }
        );


    return map;
}


/* ============================================================
   LOAD M-PESA RECORDS
============================================================ */

async function loadPayments(){

    setLoadingState();

    /*
        First load the exact payments schema.

        We intentionally do NOT request columns that are
        not present in Migration 04.
    */

    const {
        data:paymentRows,
        error:paymentError
    } =
        await supabaseClient
            .from("payments")
            .select(`
                id,
                order_id,
                user_id,
                event_id,
                method,
                provider,
                status,
                amount,
                currency,
                reference,
                transaction_id,
                receipt_number,
                provider_transaction_id,
                raw_response,
                failure_reason,
                paid_at,
                created_at,
                updated_at
            `)
            .eq(
                "method",
                "mpesa"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(5000);


    if(paymentError){

        console.error(
            "Payments query failed:",
            paymentError
        );

        allPayments = [];

        renderEmptyState(
            "Unable to load M-Pesa payments",
            "The authenticated administrator could not read the payments table."
        );

        updateStats();

        throw paymentError;
    }


    const payments =
        Array.isArray(paymentRows)
            ? paymentRows
            : [];


    /*
        Load actual M-Pesa transaction records.

        This table contains the Daraja/STK-specific information.
    */

    let mpesaRows = [];


    const {
        data:mpesaData,
        error:mpesaError
    } =
        await supabaseClient
            .from("mpesa_transactions")
            .select(`
                id,
                payment_id,
                phone_number,
                amount,
                merchant_request_id,
                checkout_request_id,
                mpesa_receipt_number,
                result_code,
                result_description,
                status,
                callback_received_at,
                created_at,
                updated_at
            `)
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(5000);


    if(mpesaError){

        /*
            Do not fail the entire page if the
            M-Pesa transaction table is temporarily
            unavailable. The payment records remain useful.
        */

        console.warn(
            "M-Pesa transaction table unavailable:",
            mpesaError
        );

    }else{

        mpesaRows =
            Array.isArray(mpesaData)
                ? mpesaData
                : [];
    }


    const eventIds =
        payments
            .map(
                payment =>
                    payment.event_id
            )
            .filter(Boolean);


    const eventMap =
        await loadEventMap(
            eventIds
        );


    /*
        Build lookup maps for the actual M-Pesa table.
    */

    const mpesaByPaymentId =
        new Map();

    const mpesaByCheckoutRequest =
        new Map();

    const mpesaByMerchantRequest =
        new Map();

    const mpesaByReceipt =
        new Map();


    mpesaRows.forEach(
        transaction => {

            if(transaction.payment_id){

                mpesaByPaymentId.set(
                    String(
                        transaction.payment_id
                    ),
                    transaction
                );
            }


            if(
                transaction.checkout_request_id
            ){

                mpesaByCheckoutRequest.set(
                    String(
                        transaction.checkout_request_id
                    ),
                    transaction
                );
            }


            if(
                transaction.merchant_request_id
            ){

                mpesaByMerchantRequest.set(
                    String(
                        transaction.merchant_request_id
                    ),
                    transaction
                );
            }


            if(
                transaction.mpesa_receipt_number
            ){

                mpesaByReceipt.set(
                    String(
                        transaction.mpesa_receipt_number
                    ),
                    transaction
                );
            }
        }
    );


    /*
        Merge the payment record with its
        M-Pesa transaction record.
    */

    allPayments =
        payments.map(
            payment => {

                let mpesa =
                    mpesaByPaymentId.get(
                        String(payment.id)
                    );


                if(!mpesa){

                    mpesa =
                        mpesaByCheckoutRequest.get(
                            String(
                                payment.transaction_id ||
                                ""
                            )
                        );
                }


                if(!mpesa){

                    mpesa =
                        mpesaByMerchantRequest.get(
                            String(
                                payment.reference ||
                                ""
                            )
                        );
                }


                if(!mpesa){

                    mpesa =
                        mpesaByReceipt.get(
                            String(
                                payment.receipt_number ||
                                ""
                            )
                        );
                }


                return normalizePayment(
                    payment,
                    mpesa,
                    eventMap
                );
            }
        );


    updateStats();

    applyFilters();
}


/* ============================================================
   NORMALIZE PAYMENT
============================================================ */

function normalizePayment(
    payment,
    mpesa,
    eventMap
){

    const transactionId =
        payment.transaction_id ||
        mpesa?.checkout_request_id ||
        "";


    const reference =
        payment.reference ||
        mpesa?.merchant_request_id ||
        "";


    const receipt =
        payment.receipt_number ||
        mpesa?.mpesa_receipt_number ||
        "";


    const phone =
        mpesa?.phone_number ||
        "";


    const status =
        normalizeStatus(
            payment
        );


    return {

        rawPayment:
            payment,

        rawMpesa:
            mpesa || null,

        id:
            payment.id,

        orderId:
            payment.order_id,

        userId:
            payment.user_id,

        eventId:
            payment.event_id,

        eventTitle:
            eventMap.get(
                String(
                    payment.event_id || ""
                )
            ) || "",

        amount:
            payment.amount,

        currency:
            String(
                payment.currency ||
                ""
            ).toUpperCase(),

        method:
            payment.method,

        provider:
            payment.provider,

        status,

        transactionId,

        reference,

        receipt,

        phone,

        merchantRequestId:
            mpesa?.merchant_request_id ||
            "",

        checkoutRequestId:
            mpesa?.checkout_request_id ||
            "",

        resultCode:
            mpesa?.result_code ??
            null,

        resultDescription:
            mpesa?.result_description ||
            "",

        mpesaStatus:
            mpesa?.status ||
            "",

        providerTransactionId:
            payment.provider_transaction_id ||
            "",

        failureReason:
            payment.failure_reason ||
            "",

        createdAt:
            payment.created_at,

        paidAt:
            payment.paid_at,

        updatedAt:
            payment.updated_at,

        callbackReceivedAt:
            mpesa?.callback_received_at ||
            null
    };
}


/* ============================================================
   FILTERS
============================================================ */

function applyFilters(){

    const search =
        $("searchInput")
            ?.value
            ?.trim()
            .toLowerCase() ||
        "";


    const status =
        $("statusFilter")
            ?.value ||
        "";


    const period =
        $("periodFilter")
            ?.value ||
        "";


    const currency =
        (
            $("currencyFilter")
                ?.value ||
            ""
        )
        .toUpperCase();


    const now =
        new Date();


    filteredPayments =
        allPayments.filter(
            payment => {

                /*
                    SEARCH
                */

                if(search){

                    const haystack = [

                        payment.id,

                        payment.orderId,

                        payment.userId,

                        payment.eventId,

                        payment.transactionId,

                        payment.reference,

                        payment.receipt,

                        payment.phone,

                        payment.eventTitle,

                        payment.merchantRequestId,

                        payment.checkoutRequestId,

                        payment.providerTransactionId

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    if(
                        !haystack.includes(
                            search
                        )
                    ){
                        return false;
                    }
                }


                /*
                    STATUS
                */

                if(
                    status &&
                    payment.status !== status
                ){
                    return false;
                }


                /*
                    CURRENCY
                */

                if(
                    currency &&
                    payment.currency !== currency
                ){
                    return false;
                }


                /*
                    PERIOD
                */

                if(period){

                    const sourceDate =
                        payment.createdAt ||
                        payment.paidAt;


                    if(!sourceDate){
                        return false;
                    }


                    const date =
                        new Date(
                            sourceDate
                        );


                    if(
                        Number.isNaN(
                            date.getTime()
                        )
                    ){
                        return false;
                    }


                    if(
                        period === "today"
                    ){

                        const start =
                            new Date(now);

                        start.setHours(
                            0,
                            0,
                            0,
                            0
                        );


                        if(date < start){
                            return false;
                        }

                    }else{

                        const days =
                            Number(period);


                        if(
                            !Number.isFinite(
                                days
                            )
                        ){
                            return true;
                        }


                        const cutoff =
                            new Date(now);


                        cutoff.setDate(
                            cutoff.getDate() -
                            days
                        );


                        if(
                            date < cutoff
                        ){
                            return false;
                        }
                    }
                }


                return true;
            }
        );


    currentPage = 1;

    renderPayments();

    renderPagination();
}


/* ============================================================
   STATISTICS
============================================================ */

function updateStats(){

    const total =
        allPayments.length;


    const successful =
        allPayments.filter(
            payment =>
                payment.status ===
                "success"
        ).length;


    const pending =
        allPayments.filter(
            payment =>
                payment.status ===
                "pending"
        ).length;


    const failed =
        allPayments.filter(
            payment =>
                payment.status === "failed" ||
                payment.status === "cancelled"
        ).length;


    if($("statTransactions")){
        $("statTransactions")
            .textContent =
            total.toLocaleString();
    }


    if($("statSuccessful")){
        $("statSuccessful")
            .textContent =
            successful.toLocaleString();
    }


    if($("statPending")){
        $("statPending")
            .textContent =
            pending.toLocaleString();
    }


    if($("statFailed")){
        $("statFailed")
            .textContent =
            failed.toLocaleString();
    }
}


/* ============================================================
   PAGINATION
============================================================ */

function getCurrentPageRows(){

    const start =
        (
            currentPage - 1
        ) * PAGE_SIZE;


    return filteredPayments.slice(
        start,
        start + PAGE_SIZE
    );
}


function renderPagination(){

    const total =
        filteredPayments.length;


    const pages =
        Math.max(
            1,
            Math.ceil(
                total /
                PAGE_SIZE
            )
        );


    const pagination =
        $("pagination");


    if(
        !pagination ||
        !total ||
        pages <= 1
    ){

        if(pagination){
            pagination.hidden =
                true;
        }

        return;
    }


    pagination.hidden =
        false;


    const start =
        (
            currentPage - 1
        ) * PAGE_SIZE + 1;


    const end =
        Math.min(
            currentPage *
            PAGE_SIZE,
            total
        );


    $("paginationInfo")
        .textContent =
        `${start}–${end} of ${total}`;


    $("prevPageBtn")
        .disabled =
        currentPage <= 1;


    $("nextPageBtn")
        .disabled =
        currentPage >= pages;
}


/* ============================================================
   RENDER
============================================================ */

function renderPayments(){

    const rows =
        getCurrentPageRows();


    const tbody =
        $("tableBody");


    if(!filteredPayments.length){

        renderEmptyState(
            "No M-Pesa transactions found",
            allPayments.length
                ? "No transactions match the selected filters."
                : "No M-Pesa payment records are currently available."
        );


        if($("mobileList")){
            $("mobileList").innerHTML =
                "";
        }


        return;
    }


    tbody.innerHTML =
        rows
            .map(
                payment => `

                    <tr>

                        <td>

                            <div class="primary-cell mono">
                                ${escapeHtml(
                                    payment.transactionId ||
                                    payment.id
                                )}
                            </div>

                            <div class="secondary-cell">
                                ${escapeHtml(
                                    payment.phone ||
                                    "Phone unavailable"
                                )}
                            </div>

                        </td>


                        <td>

                            <div class="primary-cell mono">
                                ${escapeHtml(
                                    payment.orderId ||
                                    "—"
                                )}
                            </div>

                            <div class="secondary-cell">
                                ${escapeHtml(
                                    payment.eventTitle ||
                                    "Event unavailable"
                                )}
                            </div>

                        </td>


                        <td>

                            <div class="primary-cell">
                                ${formatAmount(
                                    payment.amount,
                                    payment.currency
                                )}
                            </div>

                        </td>


                        <td>

                            ${statusBadge(
                                payment.status
                            )}

                        </td>


                        <td>

                            <div class="mono">
                                ${escapeHtml(
                                    payment.reference ||
                                    payment.receipt ||
                                    "—"
                                )}
                            </div>

                        </td>


                        <td>

                            ${escapeHtml(
                                formatDate(
                                    payment.createdAt
                                )
                            )}

                        </td>


                        <td>

                            <div class="row-actions">

                                <button
                                    type="button"
                                    class="small-btn"
                                    data-view-id="${escapeHtml(
                                        payment.id
                                    )}"
                                >
                                    View
                                </button>

                            </div>

                        </td>

                    </tr>
                `
            )
            .join("");


    renderMobileRows(
        rows
    );


    attachViewButtons();
}


function renderMobileRows(
    rows
){

    const mobile =
        $("mobileList");


    if(!mobile){
        return;
    }


    mobile.innerHTML =
        rows
            .map(
                payment => `

                    <article class="mobile-card">

                        <div class="mobile-card-top">

                            <div class="mobile-title">

                                <strong class="mono">
                                    ${escapeHtml(
                                        payment.transactionId ||
                                        payment.id
                                    )}
                                </strong>

                                <span>
                                    ${escapeHtml(
                                        payment.phone ||
                                        "M-Pesa customer"
                                    )}
                                </span>

/* ============================================================
   CSV EXPORT
============================================================ */

function csvEscape(
    value
){

    const text =
        value === null ||
        value === undefined
            ? ""
            : String(value);


    return `"${text.replace(
        /"/g,
        '""'
    )}"`;
}


function exportCsv(){

    if(!filteredPayments.length){

        showToast(
            "There are no M-Pesa records to export.",
            "error"
        );

        return;
    }


    const headers = [

        "Payment ID",

        "Transaction ID",

        "Order ID",

        "User ID",

        "Event ID",

        "Event",

        "Phone",

        "Method",

        "Provider",

        "Status",

        "Amount",

        "Currency",

        "Reference",

        "Receipt",

        "Merchant Request ID",

        "Checkout Request ID",

        "Provider Transaction ID",

        "Failure Reason",

        "M-Pesa Status",

        "Result Code",

        "Result Description",

        "Created At",

        "Paid At",

        "Callback Received At",

        "Updated At"
    ];


    const lines = [

        headers
            .map(csvEscape)
            .join(",")
    ];


    filteredPayments.forEach(
        payment => {

            lines.push(

                [

                    payment.id,

                    payment.transactionId,

                    payment.orderId,

                    payment.userId,

                    payment.eventId,

                    payment.eventTitle,

                    payment.phone,

                    payment.method,

                    payment.provider,

                    payment.status,

                    payment.amount,

                    payment.currency,

                    payment.reference,

                    payment.receipt,

                    payment.merchantRequestId,

                    payment.checkoutRequestId,

                    payment.providerTransactionId,

                    payment.failureReason,

                    payment.mpesaStatus,

                    payment.resultCode,

                    payment.resultDescription,

                    payment.createdAt,

                    payment.paidAt,

                    payment.callbackReceivedAt,

                    payment.updatedAt

                ]
                    .map(csvEscape)
                    .join(",")
            );
        }
    );


    const blob =
        new Blob(
            [
                lines.join("\n")
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "k-tickets-mpesa-" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".csv";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "CSV export created.",
        "success"
    );
}

/* ============================================================
   NOTIFICATIONS
============================================================ */

async function checkNotifications(){

    try{

        /*
            Actual notifications schema:
            is_read
        */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("notifications")
                .select("id")
                .eq(
                    "user_id",
                    currentUser.id
                )
                .eq(
                    "is_read",
                    false
                )
                .limit(1);


        if(error){

            console.warn(
                "Notification check unavailable:",
                error
            );

            return;
        }


        const dot =
            $("notificationDot");


        if(dot){

            dot.hidden =
                !(data?.length);
        }

    }catch(error){

        console.warn(
            "Notification check failed:",
            error
        );
    }
}

/* ============================================================
   AUTH LISTENER
============================================================ */

function setupAuthListener(){

    supabaseClient
        .auth
        .onAuthStateChange(
            (
                event,
                session
            ) => {

                if(
                    event ===
                    "SIGNED_OUT" ||
                    !session
                ){

                    redirectLogin(
                        "session_expired"
                    );
                }
            }
        );
}


/* ============================================================
   EVENTS
============================================================ */

function setupEvents(){

    $("searchInput")
        ?.addEventListener(
            "input",
            applyFilters
        );


    $("statusFilter")
        ?.addEventListener(
            "change",
            applyFilters
        );


    $("periodFilter")
        ?.addEventListener(
            "change",
            applyFilters
        );


    $("currencyFilter")
        ?.addEventListener(
            "change",
            applyFilters
        );


    $("clearFiltersBtn")
        ?.addEventListener(
            "click",
            () => {

                $("searchInput").value =
                    "";

                $("statusFilter").value =
                    "";

                $("periodFilter").value =
                    "";

                $("currencyFilter").value =
                    "";

                applyFilters();
            }
        );


    const refresh =
        async () => {

            try{

                await loadPayments();

                showToast(
                    "M-Pesa data refreshed.",
                    "success"
                );

            }catch(error){

                console.error(
                    error
                );

                showToast(
                    "Unable to refresh M-Pesa data.",
                    "error"
                );
            }
        };


    $("refreshBtn")
        ?.addEventListener(
            "click",
            refresh
        );


    $("refreshDataBtn")
        ?.addEventListener(
            "click",
            refresh
        );


    $("exportBtn")
        ?.addEventListener(
            "click",
            exportCsv
        );


    $("prevPageBtn")
        ?.addEventListener(
            "click",
            () => {

                if(
                    currentPage > 1
                ){

                    currentPage--;

                    renderPayments();

                    renderPagination();
                }
            }
        );


    $("nextPageBtn")
        ?.addEventListener(
            "click",
            () => {

                const pages =
                    Math.ceil(
                        filteredPayments.length /
                        PAGE_SIZE
                    );


                if(
                    currentPage < pages
                ){

                    currentPage++;

                    renderPayments();

                    renderPagination();
                }
            }
        );


    $("closeDrawerBtn")
        ?.addEventListener(
            "click",
            closeDrawer
        );


    $("drawerBackdrop")
        ?.addEventListener(
            "click",
            event => {

                if(
                    event.target ===
                    $("drawerBackdrop")
                ){

                    closeDrawer();
                }
            }
        );


    document.addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Escape"
            ){

                closeDrawer();
            }
        }
    );


    $("signOutBtn")
        ?.addEventListener(
            "click",
            safeSignOut
        );


    $("notificationBtn")
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "./notifications.html";
            }
        );


    setupMobileNavigation();
}


/* ============================================================
   BOOT
============================================================ */

async function boot(){

    try{

        initializeSupabase();


        const allowed =
            await verifyAdmin();


        if(!allowed){
            return;
        }


        setupAuthListener();

        setupEvents();


        await loadPayments();

        await checkNotifications();


        $("securityGate")
            .style
            .display =
            "none";


        $("app")
            .style
            .display =
            "block";


    }catch(error){

        console.error(
            "K-Tickets M-Pesa admin initialization failed:",
            error
        );


        const gate =
            $("securityGate");


        if(gate){

            gate.innerHTML = `

                <div class="security-card">

                    <div
                        class="security-mark"
                        style="background:#6C151E;"
                    >
                        !
                    </div>

                    <h2>
                        Admin Access Unavailable
                    </h2>

                    <p>
                        The administrator area could not
                        be securely initialized. Please
                        sign in again or contact the
                        platform administrator.
                    </p>

                    <button
                        class="btn primary"
                        style="margin-top:20px;"
                        onclick="window.location.replace('/login.html')"
                    >
                        Return to Login
                    </button>

                </div>
            `;
        }
    }
}


/* ============================================================
   START
============================================================ */

boot();

</script>
